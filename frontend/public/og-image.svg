<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>

    <!-- Radial Glows -->
    <radialGradient id="indigoGlow" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#312e81" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="50%" stop-color="#047857" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#indigoGlow)"/>
  <rect width="1200" height="630" fill="url(#emeraldGlow)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Outer Elegant Tech Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6"/>
  <rect x="28" y="28" width="1144" height="574" rx="24" fill="none" stroke="#6366f1" stroke-width="1" stroke-opacity="0.25"/>

  <!-- TOP BAR -->
  <!-- Brand Logo -->
  <g transform="translate(64, 56)">
    <!-- Squircle Icon -->
    <rect width="56" height="56" rx="16" fill="#18181b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="3" y="3" width="50" height="50" rx="13" fill="#10100e"/>
    <text x="28" y="39" text-anchor="middle" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="32" font-weight="900" fill="#d9f99d">M</text>

    <!-- Brand Typography -->
    <text x="72" y="39" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Molinaz<tspan fill="#818cf8">Dev</tspan>
    </text>
  </g>

  <!-- Top Right Status Badge -->
  <g transform="translate(860, 60)">
    <rect width="276" height="46" rx="23" fill="#1e293b" stroke="#334155" stroke-width="1.5" fill-opacity="0.9"/>
    <!-- Pulsing Green Dot -->
    <circle cx="26" cy="23" r="6" fill="#10b981"/>
    <circle cx="26" cy="23" r="10" fill="#10b981" fill-opacity="0.25"/>
    <text x="44" y="29" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="14" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">
      LIMA, PERÚ · DISPONIBLE
    </text>
  </g>

  <!-- MAIN HERO TEXT (Left Area) -->
  <g transform="translate(64, 180)">
    <!-- Small Overline Pill -->
    <g transform="translate(0, 0)">
      <rect width="320" height="34" rx="17" fill="#312e81" stroke="#4f46e5" stroke-width="1.2" fill-opacity="0.6"/>
      <text x="18" y="22" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="800" fill="#c7d2fe" letter-spacing="1">
        ⚡ AGENCIA DE DESARROLLO DIGITAL
      </text>
    </g>

    <!-- Primary Bold Headline -->
    <text x="0" y="85" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1">
      Desarrollo Web, Chatbots IA
    </text>
    <text x="0" y="145" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="52" font-weight="900" fill="#818cf8" letter-spacing="-1">
      &amp; Software a Medida.
    </text>

    <!-- Subtitle / Hook -->
    <text x="0" y="200" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="21" font-weight="500" fill="#94a3b8">
      Soluciones digitales de alto impacto que automatizan tu atención,
    </text>
    <text x="0" y="232" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="21" font-weight="500" fill="#94a3b8">
      optimizan tus procesos y <tspan fill="#f8fafc" font-weight="700">multiplican tus ventas</tspan>.
    </text>
  </g>

  <!-- RIGHT INTERACTIVE / STATS CARDS -->
  <g transform="translate(770, 160)">
    <!-- Card 1: Chatbot IA Stat -->
    <g transform="translate(0, 0)">
      <rect width="366" height="106" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="24" width="56" height="56" rx="14" fill="#312e81" stroke="#4338ca" stroke-width="1"/>
      <text x="48" y="60" text-anchor="middle" font-size="28">🤖</text>
      <text x="92" y="47" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff">
        Chatbots con IA 24/7
      </text>
      <text x="92" y="71" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
        Respuestas instantáneas en WhatsApp
      </text>
    </g>

    <!-- Card 2: Web & Ecommerce Stat -->
    <g transform="translate(0, 122)">
      <rect width="366" height="106" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
      <rect x="20" y="24" width="56" height="56" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1"/>
      <text x="48" y="60" text-anchor="middle" font-size="28">🚀</text>
      <text x="92" y="47" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="17" font-weight="800" fill="#ffffff">
        Páginas Web &amp; Tiendas
      </text>
      <text x="92" y="71" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
        Ultrarrápidas, modernas y con SEO
      </text>
    </g>
  </g>

  <!-- BOTTOM PILL TAGS & TRUST BAR -->
  <g transform="translate(64, 490)">
    <!-- Pill 1: E-commerce -->
    <g transform="translate(0, 0)">
      <rect width="210" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="30" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
        🌐 Páginas &amp; Tiendas
      </text>
    </g>

    <!-- Pill 2: IA & Chatbots -->
    <g transform="translate(224, 0)">
      <rect width="180" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="24" y="30" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
        🤖 Agentes IA
      </text>
    </g>

    <!-- Pill 3: Pagos / RUC -->
    <g transform="translate(418, 0)">
      <rect width="240" height="48" rx="24" fill="#1e293b" stroke="#334155" stroke-width="1.2"/>
      <text x="22" y="30" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="15" font-weight="700" fill="#f8fafc">
        🛡️ RUC 15613205389
      </text>
    </g>

    <!-- Domain link CTA on the right -->
    <g transform="translate(850, 4)">
      <text x="220" y="30" text-anchor="end" font-family="Segoe UI, -apple-system, Roboto, sans-serif" font-size="20" font-weight="800" fill="#818cf8">
        molinazdev.lat ↗
      </text>
    </g>
  </g>
</svg>