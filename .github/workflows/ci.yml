name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-backend:
    name: Backend Build & Tests (.NET 8)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore DigitalServices.sln

      - name: Build solution
        run: dotnet build DigitalServices.sln --no-restore --configuration Release

      - name: Run unit & integration tests
        run: dotnet test DigitalServices.sln --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

  build-frontend:
    name: Frontend Build (Astro & Tailwind)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Astro static site
        working-directory: frontend
        run: npm run build
